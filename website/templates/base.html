<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.site_name }}{% endblock %}</title>
<style>
:root { --ink:#17212b; --muted:#536173; --line:#d9e2ec; --blue:#1b6ca8; --bg:#f7fafc; }
* { box-sizing:border-box; }
body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; }
header { background:#fff; border-bottom:1px solid var(--line); }
.wrap { max-width: 980px; margin:0 auto; padding:0 20px; }
nav { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:14px 0; }
nav a { color:var(--muted); text-decoration:none; font-size:14px; }
nav a:hover { color:var(--blue); }
.brand { font-weight:700; color:var(--ink); margin-right:auto; font-size:18px; }
main { padding:36px 0 64px; }
h1 { font-size:30px; line-height:1.2; margin:0 0 10px; }
h2 { font-size:20px; margin-top:30px; }
p, li { font-size:15.5px; }
.lead { font-size:18px; color:var(--muted); max-width:760px; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin:16px 0; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13.5px; }
pre { background:#0f1b26; color:#e7eef5; padding:14px; border-radius:6px; overflow:auto; }
table { border-collapse:collapse; width:100%; background:#fff; margin:12px 0; }
th, td { border:1px solid var(--line); padding:7px 9px; text-align:left; font-size:14px; vertical-align:top; }
th { background:#eef3f7; }
.btn { display:inline-block; background:var(--blue); color:#fff; border:0; border-radius:5px; padding:9px 14px; font-size:14px; text-decoration:none; cursor:pointer; }
.btn:hover { filter:brightness(.95); }
.notice { border-left:4px solid var(--blue); background:#eef6fb; padding:12px 14px; margin:16px 0; }
.warn { border-left:4px solid #a0522d; background:#fbf1ea; padding:12px 14px; margin:16px 0; }
footer { border-top:1px solid var(--line); color:var(--muted); font-size:13px; padding:20px 0; }
.small { font-size:13px; color:var(--muted); }
label { font-size:14px; font-weight:600; }
input[type=file], select { display:block; margin:6px 0 14px; font-size:14px; }
.error { color:#8c2d04; font-weight:600; }
@media (max-width:600px){ h1{font-size:25px;} nav{gap:10px;} }
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <span class="brand">LimitAware</span>
  <a href="/">Home</a><a href="/docs">Docs</a><a href="/example">Example</a>
  <a href="/app">Demo</a><a href="/evaluation">Evaluation</a><a href="/limitations">Limits</a><a href="/cite">Cite</a>
</nav></div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer><div class="wrap">LimitAware {{ version }} · living demonstration · not a regulatory or clinical tool{% if cfg.repository_url %} · <a href="{{ cfg.repository_url }}">Repository</a>{% endif %}{% if cfg.archive_doi %} · <a href="https://doi.org/{{ cfg.archive_doi }}">Archive DOI</a>{% endif %}</div></footer>
</body></html>
